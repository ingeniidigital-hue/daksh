version: '3.8'

# Plane Community Edition — Self-Hosted AI-Friendly Project Management
# Official Repository: https://github.com/makeplane/plane
# Port: 8090 (Web UI & REST API via unified Nginx proxy)

services:
  plane-proxy:
    image: nginx:alpine
    container_name: daksh-plane-proxy
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - plane-frontend
      - plane-api

  plane-frontend:
    image: makeplane/plane-frontend:v0.22.0
    container_name: daksh-plane-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8090/api
    depends_on:
      - plane-api

  plane-api:
    image: makeplane/plane-backend:v0.22.0
    container_name: daksh-plane-api
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment:
      - DJANGO_SETTINGS_MODULE=plane.settings.production
      - DATABASE_URL=postgresql://plane:plane_secure_pass@plane-db:5432/plane
      - REDIS_URL=redis://plane-redis:6379/0
      - SECRET_KEY=daksh_plane_secret_key_change_in_production
      - WEB_URL=http://localhost:8090
      - CORS_ALLOWED_ORIGINS=http://localhost:8090
    depends_on:
      - plane-db
      - plane-redis

  plane-db:
    image: postgres:16-alpine
    container_name: daksh-plane-db
    restart: unless-stopped
    volumes:
      - plane_pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=plane_secure_pass

  plane-redis:
    image: redis:7-alpine
    container_name: daksh-plane-redis
    restart: unless-stopped

volumes:
  plane_pgdata:
