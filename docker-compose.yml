version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: daksh-postgres
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      - POSTGRES_DB=daksh
      - POSTGRES_PASSWORD=localdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daksh"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - daksh_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: daksh-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - daksh_redisdata:/data
    restart: unless-stopped

  nakama:
    image: heroiclabs/nakama:3.22.0
    container_name: daksh-nakama
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/daksh?sslmode=disable &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/daksh?sslmode=disable
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./local.yml:/nakama/data/local.yml:ro
      - ./daksh-engine/data/modules:/nakama/data/modules:ro
    restart: unless-stopped

volumes:
  daksh_pgdata:
  daksh_redisdata:
