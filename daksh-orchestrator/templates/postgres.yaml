apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-{{TITLE_ID}}
  labels:
    app: postgres
    title: "{{TITLE_ID}}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      title: "{{TITLE_ID}}"
  template:
    metadata:
      labels:
        app: postgres
        title: "{{TITLE_ID}}"
    spec:
      containers:
      - name: postgres
        image: postgres:12.2-alpine
        env:
        - name: POSTGRES_DB
          value: "nakama"
        - name: POSTGRES_PASSWORD
          value: "localdb"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-{{TITLE_ID}}
  labels:
    app: postgres
    title: "{{TITLE_ID}}"
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
    title: "{{TITLE_ID}}"
